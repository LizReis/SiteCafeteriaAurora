spring.application.name=cafe-aurora
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Banco local de desenvolvimento. Não publicar arquivos do H2 no Git.
spring.datasource.url=jdbc:h2:file:./data/cafeaurora
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração temporária para desenvolvimento; usar migrações antes de produção.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Credenciais locais da API administrativa (obrigatório informar senha no ambiente)
cafe.admin.username=${CAFE_ADMIN_USERNAME:admin}
cafe.admin.password=${CAFE_ADMIN_PASSWORD:}

# Valores oficiais do checkout; sem gateway nesta etapa.
cafe.pedido.taxa-entrega=7.00
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
