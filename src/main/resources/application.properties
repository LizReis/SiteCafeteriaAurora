spring.application.name=cafe-aurora

# Banco local de desenvolvimento. Não publicar arquivos do H2 no Git.
spring.datasource.url=jdbc:h2:file:./data/cafeaurora
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração temporária para desenvolvimento; usar migrações antes de produção.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
