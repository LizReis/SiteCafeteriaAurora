# Perfil exclusivo para desenvolvimento via Maven, na raiz do repositório.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Evita ter que executar ./mvnw resources:resources após editar HTML, CSS ou JS.
# Estas pastas são lidas diretamente do workspace.
spring.web.resources.static-locations=file:./src/main/resources/static/,classpath:/static/
spring.thymeleaf.prefix=file:./src/main/resources/templates/
spring.thymeleaf.cache=false

# Não cachear respostas de recursos estáticos no navegador.
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# DevTools: reinício para alterações de classes e LiveReload na porta 35729.
spring.devtools.livereload.enabled=true
