<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: siteHead('Menu de Café - Café Aurora', 'cardapio-cafe.css')}"></head>
<body class="menu-page-bg cafe-menu-page">
<header th:replace="~{fragments/layout :: siteHeader}"></header>

<main class="cafe-menu" id="cardapio-cafes">
  <div class="coffee-grains" aria-hidden="true"></div>
  <div class="cafe-menu-inner">
    <div class="coffee-menu-brand">
      <img src="/img/logo-agrupada.svg" th:src="@{/img/logo-agrupada.svg}"
           alt="Café Aurora" width="250" height="153">
    </div>

    <div class="cafe-menu-intro">
      <div class="cafe-menu-intro-copy">
        <div class="cafe-script-heading"><span>just coffee</span><span class="cafe-heading-line"></span></div>
        <h1>Menu de Café</h1>
        <p>Sabores cuidadosamente selecionados para transformar o seu dia em um bom momento.</p>
      </div>
      <a class="cafe-other-menu" href="/cardapio-drinks.html" th:href="@{/cardapio-drinks.html}">
        <small>EXPLORAR TAMBÉM</small>
        <span>Menu de Drinks <span aria-hidden="true">↗</span></span>
      </a>
    </div>

    <section class="coffee-category" th:each="secao : ${secoes}" th:attr="aria-labelledby=${'secao-' + secao.id}">
        <div class="coffee-category-heading">
        <h2 th:id="${'secao-' + secao.id}"><span class="coffee-cup-icon" aria-hidden="true">♨</span> <span th:text="${secao.nome}"></span></h2>
        <span class="coffee-category-rule" aria-hidden="true"></span>
      </div>
        <p class="menu-empty" th:if="${#lists.isEmpty(secao.produtos)}">Nenhum produto nesta seção no momento.</p>
        <div class="coffee-products-grid"><article class="coffee-product" th:each="produto : ${secao.produtos}"
          th:attr="data-product-id=${produto.id},data-price-cents=${produto.precoCentavos},data-available=${produto.disponivel}">
          <img th:src="${produto.imagem}" th:alt="${produto.nome}" loading="lazy"
            onerror="this.onerror=null;this.src='/img/produto-sem-imagem.svg'">
          <div class="coffee-product-info">
            <div class="coffee-product-name"><h3 th:text="${produto.nome}"></h3><span class="price-leader"></span><strong th:text="${produto.precoFormatado}"></strong></div>
            <p th:text="${produto.descricao}"></p><small class="menu-status" th:unless="${produto.disponivel}">Indisponível</small>
          </div>
          <div class="coffee-quantity" th:attr="aria-label=${'Quantidade de ' + produto.nome}">
            <button type="button" class="quantity-minus" th:attr="aria-label=${'Diminuir ' + produto.nome}" th:disabled="${!produto.disponivel}">−</button>
            <output aria-live="polite">0</output>
            <button type="button" class="quantity-plus" th:attr="aria-label=${'Aumentar ' + produto.nome}" th:disabled="${!produto.disponivel}">+</button>
          </div>
        </article></div>
      </section>
      <p class="menu-empty" th:if="${#lists.isEmpty(secoes)}">Cardápio em atualização.</p>
  </div>
</main>
<script src="/js/cardapio-cafe.js" th:src="@{/js/cardapio-cafe.js(v='20261019-animacoes-3')}" defer></script>
  <footer th:replace="~{fragments/layout :: siteFooter}"></footer>
  <script src="/js/footer.js" th:src="@{/js/footer.js(v=20261031)}" defer></script>
</body>
</html>
