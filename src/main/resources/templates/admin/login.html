<!doctype html><html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Café Aurora | Administração</title><link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"><link rel="stylesheet" th:href="@{/css/admin.css}" href="/css/admin.css"></head><body class="aurora-admin"><main class="admin-login"><div class="admin-login-card"><a class="admin-login-logo" th:href="@{/}"><img th:src="@{/img/logo-agrupada.svg}" src="/img/logo-agrupada.svg" alt="Café Aurora"></a><p class="admin-kicker">ÁREA RESTRITA</p><h1>Bem-vindo de volta</h1><p>Entre com suas credenciais para administrar a cafeteria.</p><p class="admin-alert error" role="alert" th:if="${param.error}">Usuário ou senha incorretos.</p><p class="admin-alert success" role="status" th:if="${param.logout}">Sessão encerrada com sucesso.</p><form th:action="@{/admin/login}" method="post"><label for="username">Usuário</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="admin-button" type="submit">Entrar no painel</button></form><a class="admin-return" th:href="@{/}">← Voltar para o Café Aurora</a></div></main></body></html>
