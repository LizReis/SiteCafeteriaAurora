<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#000000">
    <title>Área Administrativa | Café Aurora</title>

    <!-- Fontes e variáveis compartilhadas do site -->
    <link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}">
    <!-- Isolado: não altera categorias, produtos, pedidos ou dashboard -->
    <link rel="stylesheet" href="/css/admin.css" th:href="@{/css/admin.css}">
    <link rel="stylesheet" href="/css/admin-login.css" th:href="@{/css/admin-login.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css(v=20261113)}" href="/css/responsive.css">
</head>
<body class="aurora-admin admin-login-page">
    <main class="admin-login-layout">
        <section class="admin-login-panel" aria-labelledby="admin-login-heading">
            <a class="admin-login-logo" href="/" th:href="@{/}"
               aria-label="Voltar à página inicial do Café Aurora">
                <img src="/img/logo.svg" th:src="@{/img/logo.svg}"
                     alt="Café Aurora" width="220">
            </a>

            <h1 id="admin-login-heading">Área Administrativa</h1>
            <p class="admin-login-subtitle">Entre com suas credenciais para administrar a cafeteria.</p>
            <div class="admin-login-divider" aria-hidden="true"></div>

            <p th:if="${param.error}" class="admin-alert error" role="alert">
                Usuário ou senha incorretos.
            </p>
            <p th:if="${param.logout}" class="admin-alert success" role="status">
                Sessão encerrada com sucesso.
            </p>

            <form class="admin-login-form" action="/admin/login" th:action="@{/admin/login}" method="post">
                <div class="admin-login-field">
                    <label for="username">Usuário:</label>
                    <input id="username" name="username" type="text"
                           autocomplete="username" required autofocus>
                </div>

                <div class="admin-login-field">
                    <label for="password">Senha:</label>
                    <input id="password" name="password" type="password"
                           autocomplete="current-password" required>
                </div>

                <button type="submit" class="admin-login-submit">Entrar no painel</button>
            </form>

            <a class="admin-login-back" href="/" th:href="@{/}">
                <span aria-hidden="true">←</span> Voltar para o Café Aurora
            </a>
        </section>
    </main>
</body>
</html>
