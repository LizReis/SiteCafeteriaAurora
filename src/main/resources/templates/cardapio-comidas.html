<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: siteHead('Menu de Comida - Café Aurora', 'cardapio-comidas.css')}"></head>
<body class="menu-page-bg food-page">
  <!-- Header global: permanece igual ao das demais páginas. -->
  <header th:replace="~{fragments/layout :: siteHeader}"></header>

  <main class="food-menu" id="menu-comidas">
    <div class="food-liquid-left" aria-hidden="true"></div>
    <div class="food-liquid-right" aria-hidden="true"></div>
    <div class="food-content">
      <div class="food-brand">
        <img src="/img/logo-agrupada.svg" th:src="@{/img/logo-agrupada.svg}" alt="Café Aurora"
             width="410" height="250">
      </div>
      <div class="food-intro">
        <div class="food-intro-copy">
          <div class="food-script"><span>just food</span><span class="food-script-rule"></span></div>
          <h1>Menu de Comida</h1>
          <p>Para beliscar, saborear e compartilhar: explore nossos sanduíches, quiches e sobremesas<br
                class="food-desktop-break"> especiais.</p>
        </div>
        <a class="food-link" href="/cardapio-cafe.html" th:href="@{/cardapio-cafe.html}">
          <small>EXPLORAR TAMBÉM</small>
          <span>Menu de Café <span aria-hidden="true">↗</span></span>
        </a>
      </div>

      <section class="food-category" th:each="secao : ${secoes}" th:attr="aria-labelledby=${'secao-' + secao.id}">
        <div class="food-category-heading"><h2 th:id="${'secao-' + secao.id}"><span th:text="${secao.nome}"></span></h2><span class="food-rule"></span></div>
        <p class="menu-empty" th:if="${#lists.isEmpty(secao.produtos)}">Nenhum produto nesta seção no momento.</p>
        <div class="food-grid"><article class="food-product" th:each="produto : ${secao.produtos}"
          th:attr="data-product-id=${produto.id},data-price-cents=${produto.precoCentavos},data-available=${produto.disponivel}">
            <img th:src="${produto.imagem}" th:alt="${produto.nome}" loading="lazy"
            onerror="this.onerror=null;this.src='/img/produto-sem-imagem.svg'">
            <div class="food-product-description">
              <div class="food-product-title">
                <h3 th:text="${produto.nome}"></h3><span class="food-dots" aria-hidden="true"></span><strong th:text="${produto.precoFormatado}"></strong>
              </div>
              <p th:text="${produto.descricao}"></p><small class="menu-status" th:unless="${produto.disponivel}">Indisponível</small>
            </div>
            <div class="food-stepper" th:attr="aria-label=${'Quantidade de ' + produto.nome}">
              <button type="button" class="food-minus" th:attr="aria-label=${'Diminuir ' + produto.nome}" th:disabled="${!produto.disponivel}">−</button>
              <output aria-live="polite">0</output>
              <button type="button" class="food-plus" th:attr="aria-label=${'Aumentar ' + produto.nome}" th:disabled="${!produto.disponivel}">+</button>
            </div>
          </article></div>
      </section>
      <p class="menu-empty" th:if="${#lists.isEmpty(secoes)}">Cardápio em atualização.</p>
    </div>
  </main>

  <script src="/js/cardapio-comidas.js" th:src="@{/js/cardapio-comidas.js(v='20261029-food-1')}" defer></script>
  <footer th:replace="~{fragments/layout :: siteFooter}"></footer>
  <script src="/js/footer.js" th:src="@{/js/footer.js(v=20261031)}" defer></script>
</body>
</html>
