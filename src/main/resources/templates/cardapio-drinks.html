<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: siteHead('Menu de Drinks - Café Aurora', 'cardapio-drinks.css')}"></head>

<body class="menu-page-bg drink-page">
  <header th:replace="~{fragments/layout :: siteHeader}"></header>
  <main class="drink-menu" id="menu-drinks">
    <div class="drink-liquid" aria-hidden="true"></div>
    <div class="drink-content">
      <div class="drink-brand"><img src="/img/logo-agrupada.svg" th:src="@{/img/logo-agrupada.svg}" alt="Café Aurora"
          width="410" height="250"></div>
      <div class="drink-intro">
        <div class="drink-intro-copy">
          <div class="drink-script"><span>just drink</span><span class="drink-script-rule"></span></div>
          <h1>Menu de Drink</h1>
          <p>Bebidas refrescantes, alcoólicas e artesanais preparadas para transformar qualquer hora em um<br
              class="drink-desktop-break"> momento especial.</p>
        </div>
        <a class="drink-link" href="/cardapio-comidas.html" th:href="@{/cardapio-comidas.html}">
          <small>EXPLORAR TAMBÉM</small><span>Menu de Comida <span aria-hidden="true">↗</span></span>
        </a>
      </div>

      <section class="drink-category" th:each="secao : ${secoes}" th:attr="aria-labelledby=${'secao-' + secao.id}">
        <div class="drink-category-heading">
          <h2 th:id="${'secao-' + secao.id}"><span th:text="${secao.nome}"></span></h2><span class="drink-rule"></span>
        </div>
        <p class="menu-empty" th:if="${#lists.isEmpty(secao.produtos)}">Nenhum produto nesta seção no momento.</p>
        <div class="drink-grid"><article class="drink-product" th:each="produto : ${secao.produtos}"
          th:attr="data-product-id=${produto.id},data-price-cents=${produto.precoCentavos},data-available=${produto.disponivel}">
            <img th:src="${produto.imagem}" th:alt="${produto.nome}" loading="lazy"
            onerror="this.onerror=null;this.src='/img/produto-sem-imagem.svg'">
            <div class="drink-product-description">
              <div class="drink-product-title">
                <h3 th:text="${produto.nome}"></h3><span class="drink-dots" aria-hidden="true"></span><strong th:text="${produto.precoFormatado}"></strong>
              </div>
              <p th:text="${produto.descricao}"></p><small class="menu-status" th:unless="${produto.disponivel}">Indisponível</small>
            </div>
            <div class="drink-stepper" th:attr="aria-label=${'Quantidade de ' + produto.nome}">
              <button type="button" class="drink-minus" th:attr="aria-label=${'Diminuir ' + produto.nome}" th:disabled="${!produto.disponivel}">−</button><output
                aria-live="polite">0</output><button type="button" class="drink-plus"
                th:attr="aria-label=${'Aumentar ' + produto.nome}" th:disabled="${!produto.disponivel}">+</button>
            </div>
          </article></div>
      </section>
      <p class="menu-empty" th:if="${#lists.isEmpty(secoes)}">Cardápio em atualização.</p>
    </div>
  </main>
  <script src="/js/cardapio-drinks.js" th:src="@{/js/cardapio-drinks.js(v='20261028-drinks-animacoes-2')}" defer></script>
  <footer th:replace="~{fragments/layout :: siteFooter}"></footer>
  <script src="/js/footer.js" th:src="@{/js/footer.js(v=20261031)}" defer></script>
</body>

</html>
