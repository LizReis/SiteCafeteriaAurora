<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: siteHead('Meus Pedidos - Café Aurora', 'sacola-pedido.css')}"></head>

<body class="menu-page-bg">

    <header th:replace="~{fragments/layout :: siteHeader}"></header>

    <main class="cart-container">
        <h1 class="cart-title">Meus Pedidos</h1>

        <div class="cart-box">
            <div class="cart-item">
                <div class="cart-item-info">
                    <h3>Espresso Italiano</h3>
                    <p class="cart-item-price">R$ 10,00</p>
                </div>
                <div class="cart-controls">
                    <div class="qty-selector">
                        <button class="qty-btn">-</button>
                        <span class="qty-value">1</span>
                        <button class="qty-btn">+</button>
                    </div>
                    <button class="btn-remove">
                        <img src="https://img.icons8.com/ios/50/ffffff/delete-forever.png" alt="Remover">
                    </button>
                </div>
            </div>

            <div class="cart-item">
                <div class="cart-item-info">
                    <h3>Cappuccino</h3>
                    <p class="cart-item-price">R$ 14,00</p>
                </div>
                <div class="cart-controls">
                    <div class="qty-selector">
                        <button class="qty-btn">-</button>
                        <span class="qty-value">2</span>
                        <button class="qty-btn">+</button>
                    </div>
                    <button class="btn-remove">
                        <img src="https://img.icons8.com/ios/50/ffffff/delete-forever.png" alt="Remover">
                    </button>
                </div>
            </div>

            <div class="cart-summary">
                <div class="summary-line">
                    <span>Subtotal:</span>
                    <span>R$ 38,00</span>
                </div>
                <div class="summary-line">
                    <span>Taxa de Entrega:</span>
                    <span>R$ 5,00</span>
                </div>
                <div class="summary-total">
                    <span>Total:</span>
                    <span>R$ 43,00</span>
                </div>
            </div>

            <div class="cart-footer-actions">
                <a href="#" class="clear-cart">Esvaziar Sacola</a>
                <button class="btn-finish">Finalizar Pedido</button>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: siteFooter}"></footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/js/scripts.js"></script>

  <script src="/js/footer.js" th:src="@{/js/footer.js(v=20261031)}" defer></script>
</body>

</html>
